name: Generate Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias rafeeq \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass rafeeq2024store \
            -keypass rafeeq2024key \
            -dname "CN=Rafeeq Radio, OU=Apps, O=ElGarhy, L=Dubai, S=Dubai, C=AE" \
            -storetype JKS \
            -keystore rafeeq-release.keystore
          base64 -w 0 rafeeq-release.keystore > keystore.b64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
          retention-days: 1
