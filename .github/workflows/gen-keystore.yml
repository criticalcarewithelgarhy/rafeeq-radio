name: Generate Keystore (run once)

on:
  workflow_dispatch:

permissions:
  secrets: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias rafeeq \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass rafeeq2024store \
            -keypass rafeeq2024key \
            -dname "CN=Rafeeq Radio, OU=Apps, O=ElGarhy, L=Dubai, S=Dubai, C=AE" \
            -storetype JKS \
            -keystore rafeeq-release.keystore

      - name: Set KEYSTORE_BASE64 secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B64=$(base64 -w 0 rafeeq-release.keystore)
          gh secret set KEYSTORE_BASE64 --body "$B64" --repo ${{ github.repository }}
          echo "Secret set successfully"

      - name: Confirm other secrets
        run: |
          echo "KEY_ALIAS=rafeeq"
          echo "KEY_PASSWORD=rafeeq2024key"
          echo "STORE_PASSWORD=rafeeq2024store"
          echo "Make sure these 3 secrets are set in repo settings."
