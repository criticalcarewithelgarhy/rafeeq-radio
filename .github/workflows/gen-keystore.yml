name: Generate Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias rafeeq \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass rafeeq2024store \
            -keypass rafeeq2024key \
            -dname "CN=Rafeeq Radio, OU=Apps, O=ElGarhy, L=Dubai, S=Dubai, C=AE" \
            -keystore rafeeq-release.keystore

      - name: Output base64 keystore
        run: |
          echo "====== COPY THIS AS KEYSTORE_BASE64 SECRET ======"
          base64 -w 0 rafeeq-release.keystore
          echo ""
          echo "=================================================="
          echo "KEY_ALIAS=rafeeq"
          echo "KEY_PASSWORD=rafeeq2024key"
          echo "STORE_PASSWORD=rafeeq2024store"
